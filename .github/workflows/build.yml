name: build

on:
  schedule:
    - cron: "23 4 * * 0"   # sonntags 04:23 UTC
  workflow_dispatch: {}     # manueller Trigger jederzeit moeglich

# GITHUB_TOKEN-Permissions kommen vom Repo-Default (write-all), damit der
# Action-Download (actions/checkout) nicht blockiert wird.
# write-all deckt contents:write (Keepalive) und packages:write (GHCR) ab.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image-Pfad bestimmen (GHCR verlangt Kleinschreibung)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Login bei GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build linux/amd64 (nativ) zum Validieren
        run: |
          docker buildx create --name builder --use
          docker buildx build --platform linux/amd64 --pull -t "$IMAGE:2.11" --load .

      - name: Validieren (Version, Module, Test-Config)
        run: |
          docker run --rm "$IMAGE:2.11" caddy version
          docker run --rm "$IMAGE:2.11" caddy list-modules | grep -Ei "desec|crowdsec"
          docker run --rm -v "$PWD/test:/etc/caddy" "$IMAGE:2.11" caddy validate --config /etc/caddy/Caddyfile.test

      - name: Versionstag bestimmen
        id: tag
        run: |
          CV=$(docker run --rm "$IMAGE:2.11" caddy version | awk '{print $1}')
          echo "version=$CV"
          echo "TAG=${CV}-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Multi-Arch-Build und Push (linux/amd64 + linux/arm64 via QEMU)
        run: |
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
          docker buildx build --platform linux/amd64,linux/arm64 --pull \
            -t "$IMAGE:2.11" -t "$IMAGE:${{ steps.tag.outputs.TAG }}" --push .
          echo "Gepusht: $IMAGE:2.11 und $IMAGE:${{ steps.tag.outputs.TAG }} (amd64+arm64)"

      - name: Keepalive gegen die 60-Tage-Schedule-Deaktivierung
        # leerer Commit statt externer Action (third-party actions sind auf
        # Account-Ebene nicht freigegeben -> "Repository access blocked")
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "keepalive: scheduled workflow am Leben halten"
          git push
